version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/financial_control
      - FLASK_ENV=development
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/__pycache__
    command: python main.py
    networks:
      - financeiro_network

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=financial_control
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financeiro_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - financeiro_network

  ngrok:
    image: ngrok/ngrok:latest
    command: http app:5000
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    depends_on:
      - app
    networks:
      - financeiro_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  financeiro_network:
    driver: bridge